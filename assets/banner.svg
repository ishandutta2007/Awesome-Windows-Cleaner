<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef"/>
      <stop offset="100%" stop-color="#7579ff"/>
    </linearGradient>
    <linearGradient id="greenPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="orangePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateX(100%); opacity: 0.2; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-18px) scale(1.2); opacity: 0.9; }
    }
    @keyframes pulseRing {
      0% { r: 40px; opacity: 0.8; }
      50% { r: 65px; opacity: 0.2; }
      100% { r: 40px; opacity: 0.8; }
    }
    @keyframes radarScan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    .floating-dot-1 { animation: floatParticle 4s ease-in-out infinite; }
    .floating-dot-2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
    .floating-dot-3 { animation: floatParticle 5s ease-in-out infinite 0.7s; }
    .scan-beam { animation: sweepGlow 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .radar-circle { animation: pulseRing 3.5s ease-in-out infinite; transform-origin: 1060px 180px; }
    .radar-arm { transform-origin: 1060px 180px; animation: radarScan 8s linear infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- High-tech Grid Background -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Glowing Scan Line across the bottom/background -->
  <rect x="0" y="354" width="1200" height="3" fill="url(#titleGrad)" opacity="0.8" />
  <g class="scan-beam">
    <rect x="0" y="352" width="400" height="6" fill="url(#glowPulse)" />
  </g>

  <!-- Animated Particles in Background -->
  <circle cx="120" cy="80" r="3" fill="#00d2ff" class="floating-dot-1" />
  <circle cx="280" cy="290" r="2.5" fill="#fa709a" class="floating-dot-2" />
  <circle cx="670" cy="50" r="3" fill="#43e97b" class="floating-dot-3" />
  <circle cx="890" cy="310" r="4" fill="#00f2fe" class="floating-dot-1" />
  <circle cx="480" cy="320" r="2" fill="#b224ef" class="floating-dot-2" />

  <!-- Radar / System Optimizer Scanner Graphic on Right (behind or beside text) -->
  <g>
    <!-- Background circular guides -->
    <circle cx="1060" cy="180" r="100" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="1060" cy="180" r="70" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="1060" cy="180" class="radar-circle" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="1060" cy="180" r="6" fill="#00f2fe" filter="url(#neonGlow)" />

    <!-- Radar arm sweep -->
    <g class="radar-arm">
      <line x1="1060" y1="180" x2="1060" y2="80" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <polygon points="1060,180 1090,85 1060,80" fill="url(#titleGrad)" opacity="0.25" />
    </g>

    <!-- Speed Gauge Accents -->
    <path d="M 990 180 A 70 70 0 0 1 1130 180" fill="none" stroke="#43e97b" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <text x="1060" y="220" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">DISK PURGE</text>
    <text x="1060" y="240" text-anchor="middle" fill="#38f9d7" font-size="13" font-weight="700">OPTIMIZED 100%</text>
  </g>

  <!-- Foreground Main Branding & Text Content (High z-index, crisp clarity) -->
  <g transform="translate(70, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#00f2fe" filter="url(#neonGlow)"/>
      <text x="30" y="19" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.5">WINDOWS OPTIMIZATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#titleGrad)" font-size="46" font-weight="900" letter-spacing="-1">Awesome Windows Cleaner</text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#cbd5e1" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Suite of High-Performance System Cleaners, Debloaters &amp; Privacy Tools
    </text>

    <!-- Secondary Explanatory Details -->
    <text x="0" y="206" fill="#94a3b8" font-size="13.5" font-weight="400">
      Junk File Purge • WinSxS &amp; Component Cleaners • Privacy Hardening • Storage Analyzers
    </text>

    <!-- Feature Badges / Capability Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Disk Hygiene -->
      <g transform="translate(0, 0)">
        <rect width="150" height="34" rx="8" fill="#132337" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5"/>
        <text x="75" y="22" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">🧹 Disk Hygiene</text>
      </g>
      <!-- Pill 2: Win 10/11 Debloat -->
      <g transform="translate(162, 0)">
        <rect width="170" height="34" rx="8" fill="#201533" stroke="#b224ef" stroke-width="1" stroke-opacity="0.5"/>
        <text x="85" y="22" text-anchor="middle" fill="#f3e8ff" font-size="12" font-weight="600">🚀 Windows Debloat</text>
      </g>
      <!-- Pill 3: Deep Uninstall -->
      <g transform="translate(344, 0)">
        <rect width="155" height="34" rx="8" fill="#132b26" stroke="#43e97b" stroke-width="1" stroke-opacity="0.5"/>
        <text x="77" y="22" text-anchor="middle" fill="#dcfce7" font-size="12" font-weight="600">📦 Deep Uninstall</text>
      </g>
      <!-- Pill 4: Telemetry Purge -->
      <g transform="translate(511, 0)">
        <rect width="165" height="34" rx="8" fill="#2d1c24" stroke="#fa709a" stroke-width="1" stroke-opacity="0.5"/>
        <text x="82" y="22" text-anchor="middle" fill="#ffe4e6" font-size="12" font-weight="600">🛡️ Privacy Sweepers</text>
      </g>
    </g>
  </g>
</svg>
